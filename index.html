<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>奈良県河川監視</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    margin:0;
    padding:0;
    font-family:sans-serif;
}

.top-area{
    display:flex;
    height:50vh;
}

.map-panel{
    flex:2;
}

.legend{
    background:white;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
    line-height:1.6;
    font-size:14px;
}

.alert-panel{
    flex:1;
    overflow-y:auto;
    border-left:1px solid #ccc;
    padding:10px;
}

#map{
    height:100%;
}

.alert-group{

    max-height:200px;

    overflow-y:auto;

    border:1px solid #ccc;

    padding:5px;
}

.bottom-area{
    height:50vh;
    overflow-y:auto;
    padding:10px;
}

.system-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.station-card{
    width:280px;
    border:1px solid #ccc;
    border-radius:8px;
    padding:10px;
}

.system-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.station-card{
    width:260px;
    border:1px solid #ccc;
    border-radius:8px;
    padding:10px;
    margin-bottom:10px;
}

.station-title{
    font-weight:bold;
    margin-bottom:5px;
}

.mini-chart{
    width:240px;
    height:120px;
}

#alertToast{

    position:fixed;

    top:20px;
    right:20px;

    min-width:350px;

    max-width:500px;

    padding:15px;

    background:#fff3cd;

    border-left:6px solid orange;

    border-radius:8px;

    box-shadow:0 4px 10px rgba(0,0,0,0.2);

    font-size:16px;

    display:none;

    z-index:9999;

}

#reloadButton{

    position:fixed;

    top:10px;
    left:10px;

    z-index:9999;

    padding:8px 12px;

    border:none;

    border-radius:6px;

    background:#1976d2;

    color:white;

    cursor:pointer;
}

</style>

</head>

<body>

<button id="reloadButton">
    再読み込み
</button>

<div id="alertToast"></div>
<div class="top-area">

    <div class="map-panel">
        <div id="map"></div>
    </div>

    <div class="alert-panel">

        <h2></h2>

    <h3 id="dangerTitle">
        氾濫危険水位超過
    </h3>

    <div
          id="dangerStations"
          class="alert-group">
    </div>

    <h3 id="evacuationTitle">
        避難判断水位超過
    </h3>

    <div
          id="evacuationStations"
          class="alert-group">
    </div>

    <h3 id="warningTitle">
        氾濫注意水位超過
    </h3>

    <div
          id="warningStations"
          class="alert-group">
    </div>

    </div>

</div>

<div class="bottom-area">

    <div id="riverSystems"></div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

function showAlertToast(message){

    const toast =
        document.getElementById(
            "alertToast"
        );

    toast.innerHTML =
        `<b>新規超過</b><br><br>${message}`;

    toast.style.display =
        "block";

    const sound =
        document.getElementById(
            "alarmSound"
        );

    sound.play().catch(() => {});

    setTimeout(
        () => {

            toast.style.display =
                "none";

        },
        15000
    );

}

// ------------------
// 状態チェック
// ------------------

function checkNewAlerts(data){

    const previousStatus =
        JSON.parse(
            localStorage.getItem(
                "stationStatus"
            ) || "{}"
        );

    const messages = [];

    data.forEach(station => {

        const oldStatus =
            previousStatus[
                station.station_code
            ] ?? 0;

        const newStatus =
            station.status_level;

        if(
            newStatus >= 2 &&
            newStatus <= 4 &&
            newStatus > oldStatus
        ){

            let levelName = "";

            switch(newStatus){

                case 2:
                    levelName =
                        "氾濫注意水位";
                    break;

                case 3:
                    levelName =
                        "避難判断水位";
                    break;

                case 4:
                    levelName =
                        "氾濫危険水位";
                    break;
            }

            messages.push(
                `${station.station_name}で${levelName}を超過しました`
            );

        }

        previousStatus[
            station.station_code
        ] = newStatus;

    });

    localStorage.setItem(
        "stationStatus",
        JSON.stringify(
            previousStatus
        )
    );

    if(messages.length > 0){

        showAlertToast(
            messages.join("<br>")
        );

    }

}

// ------------------
// Leaflet
// ------------------

const map = L.map("map").setView(
    [34.55, 135.85],
    10
);

L.tileLayer(
    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 18
    }
).addTo(map);

function getColor(status){

    switch(status){

        case 4:
            return "purple";

        case 3:
            return "red";

        case 2:
            return "yellow";

        case 1:
            return "lightgreen";

        case 9:
            return "grey";

        default:
            return "deepskyblue";
    }
}

const legend = L.control({
    position: "bottomright"
});

legend.onAdd = function () {

    const div = L.DomUtil.create(
        "div",
        "legend"
    );

    div.innerHTML = `
        <b>凡例</b><br>
        <span style="color:deepskyblue;">●</span> 通常<br>
        <span style="color:lightgreen;">●</span> 水防団待機水位<br>
        <span style="color:yellow;">●</span> 氾濫注意水位<br>
        <span style="color:red;">●</span> 避難判断水位<br>
        <span style="color:purple;">●</span> 氾濫危険水位<br>
        <span style="color:grey;">●</span> 欠測
    `;

    return div;
};

legend.addTo(map);

fetch(
    "latest_water_level.json?t=" +
    Date.now()
)
.then(response => response.json())
.then(data => {

    checkNewAlerts(data); //アラーム
    // 地図描画

    const stationMarkers = {};

    data.forEach(station => {

        const marker = L.circleMarker(
            [
                station.latitude,
                station.longitude
            ],
            {
                radius: 8,
                color: getColor(
                    station.status_level
                ),
                fillOpacity: 0.8
            }
        );

        marker.addTo(map);
        marker.bindPopup(`
        <b>${station.station_name}</b><br>
        河川：${station.river_name}<br>
        水位：
        ${
            station.water_level == null
                ? "欠測"
                : station.water_level + " m"
        }<br>
        観測：${station.obs_time}<br>
        前10分変化量：
        ${
            station.change_10m == null
                ? "欠測"
        : station.change_10m + " m"
}<br><br>
        <a href="graph.html?station=${station.station_code}" target="_blank">
            グラフを見る
        </a>
        `);

marker.on(
    "mouseover",
    function () {

        this.openPopup();

    }
);

    stationMarkers[
           station.station_code
   ] = marker;

    });

    // 警戒観測所一覧
    const dangerStations =
        data.filter(
            x => x.status_level === 4
        );

    const evacuationStations =
        data.filter(
            x => x.status_level === 3
        );

    const warningStations =
        data.filter(
            x => x.status_level === 2
        );

    document.getElementById(
        "dangerTitle"
    ).innerText =
        `氾濫危険水位超過 (${dangerStations.length}局)`;

    document.getElementById(
        "evacuationTitle"
    ).innerText =
        `避難判断水位超過 (${evacuationStations.length}局)`;

    document.getElementById(
        "warningTitle"
    ).innerText =
        `氾濫注意水位超過 (${warningStations.length}局)`;

    renderAlertList(
        "dangerStations",
        dangerStations,
        "氾濫危険水位以上の観測はありません",
        "purple"
    );

    renderAlertList(
        "evacuationStations",
        evacuationStations,
        "避難判断水位以上の観測はありません",
        "red"
    );

    renderAlertList(
        "warningStations",
        warningStations,
        "氾濫注意水位以上の観測はありません",
        "yellow"
    );

function renderAlertList(
    elementId,
    stations,
    emptyMessage,
    color
){

    const container =
        document.getElementById(
            elementId
        );

    if(
        stations.length === 0
    ){

    container.innerHTML = `
        <div style="
            border-left:6px solid ${color};
            padding:8px;
            margin-bottom:8px;
            background:#fafafa;
            border-radius:4px;
        ">
            ${emptyMessage}
        </div>
    `;

        return;

    }

    stations.forEach(station => {

        const div =
            document.createElement(
                "div"
            );

        div.innerHTML = `
            <b>${station.station_name}</b><br>
            河川：${station.river_name}<br>
            水位：
            ${
                station.water_level == null
                    ? "欠測"
                    : station.water_level + " m"
            }
            <hr>
        `;

        div.style.cursor =
            "pointer";

        div.style.borderLeft =
            `6px solid ${color}`;

        div.style.padding = "8px";
        div.style.marginBottom = "8px";
        div.style.backgroundColor = "#fafafa";
        div.style.borderRadius = "4px";

        div.addEventListener(
            "click",
            () => {

                map.setView(
                    [
                        station.latitude,
                        station.longitude
                    ],
                    14
                );

                stationMarkers[
                    station.station_code
                ].openPopup();

            }
        );

        container.appendChild(
            div
        );

    });

}

    //グラフ表示部
    const grouped = {};

    data.forEach(station => {

        const system =
            station.river_system;

        if(!grouped[system]){
            grouped[system] = [];
        }

        grouped[system].push(station);

    });

    const container =
        document.getElementById(
            "riverSystems"
        );

    Object.keys(grouped)
    .forEach(system => {

        const section =
            document.createElement("div");

        section.innerHTML = `
            <h3>${system}</h3>
            <div
                class="system-row"
                id="system-${system}">
            </div>
        `;

        container.appendChild(section);

    });

    Object.keys(grouped)
    .forEach(system => {

        const row =
            document.getElementById(
                `system-${system}`
            );

        grouped[system].forEach(station => {

            const card =
                document.createElement("div");

            card.className =
                "station-card";

            card.style.border =
                `3px solid ${
                    getColor(
                        station.status_level
                    )
                }`;

            card.style.cursor = "pointer";

            card.innerHTML = `
                <div class="station-title">
                    ${station.station_name}　${station.river_name}
                </div>

                <div>
                    観測値　
                    ${
                        station.water_level == null
                            ? "欠測"
                            : station.water_level + " m"
                    }
                </div>

                <canvas
                    id="chart-${station.station_code}"
                    class="mini-chart">
                </canvas>
            `;

            row.appendChild(card);

            card.addEventListener(
                "click",
                () => {

                    map.setView(
                        [
                            station.latitude,
                            station.longitude
                        ],
                        14
                    );

                    stationMarkers[
                        station.station_code
                    ].openPopup();

                }
            );

            loadMiniChart(
                station.station_code
            );

        });

    });

function loadMiniChart(
    stationCode
){

    fetch(
        `graphs/${stationCode}.json?t=${Date.now()}`
    )

    .then(r => r.json())

    .then(data => {
 
        const history = data.history.slice(-6);

        const labels =
            history.map(
                x => x.obsTime.substring(11)
            );

        const values =
            history.map(
                x => x.stg
            );

        new Chart(

            document.getElementById(
                `chart-${stationCode}`
            ),

            {
                type:"line",

                data:{
                    labels:labels,

                    datasets:[

                    {
                        label:"観測値",
                        data:values,
                        borderColor:"blue",
                        borderWidth:2,
                        pointRadius:1
                    },

                    {
                        label:"危険",
                        data:labels.map(
                            ()=>parseFloat(data.danger_level)
                        ),
                        borderColor:"purple",
                        borderWidth:2,
                        pointRadius:0
                    },

                    {
                        label:"避難",
                        data:labels.map(
                            ()=>parseFloat(data.evacuation_level)
                        ),
                        borderColor:"red",
                        borderWidth:2,
                        pointRadius:0
                    },

                    {
                        label:"注意",
                        data:labels.map(
                            ()=>parseFloat(data.warning_level)
                        ),
                        borderColor:"yellow",
                        borderWidth:2,
                        pointRadius:0
                    },

                    {
                        label:"待機",
                        data:labels.map(
                            ()=>parseFloat(data.standby_level)
                        ),
                        borderColor:"lightgreen",
                        borderWidth:2,
                        pointRadius:0
                    }

                    ]

                },

                options:{


                    responsive: false,

                    interaction: {
                        mode: "index",
                        intersect: false
                    },

                    plugins: {

                        tooltip: {
                            enabled: true,

                            callbacks: {

                                label: function(context){

                                    return (
                                        context.dataset.label +
                                        " : " +
                                        context.parsed.y +
                                        " m"
                                    );

                                }

                            }
                        },

                        legend:{
                            display:false
                    }
                    },

                    scales:{
                        x:{
                            display:true,
                            ticks:{
                                  maxTicksLimit:4
                            }
                        },
                        y:{
                            display:true,
                            text:"m"
                        }
                    }
                }
            }
        );

    });

}

});

document.getElementById(
    "reloadButton"
).addEventListener(
    "click",
    () => {

        location.reload();

    }
);

function scheduleReload() {

    const now = new Date();

    const next = new Date(now);

    let minute =
        Math.floor(now.getMinutes() / 10) * 10 + 7;

    if (minute <= now.getMinutes()) {
        minute += 10;
    }

    next.setMinutes(
        minute,
        0,
        0
    );

    const delay =
        next.getTime() - now.getTime();

    setTimeout(
        () => location.reload(),
        delay
    );

}

scheduleReload();
  
</script>

<audio id="alarmSound" preload="auto">
    alarm.mp3
</audio>

</body>
</html>
