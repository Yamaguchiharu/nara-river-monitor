name: Update River Data

on:
  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:

jobs:
  
  update:
  
    permissions:
      contents: write
      
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install pandas
          pip install openpyxl
          pip install requests

      - name: Update JSON
        run: |
          python get_water_level.py
          python make_graph_json.py

      - name: Commit files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add latest_water_level.json
          git add graphs/

          git diff --staged --quiet || git commit -m "auto update"

      - name: Push
        run: git push origin main
